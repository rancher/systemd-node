name: Release

on:
  push:
    tags:
      - '*'

permissions: {}

jobs:
  create-draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create -R "${GITHUB_REPOSITORY}" --draft --generate-notes "${GITHUB_REF_NAME}"

  publish:
    runs-on: ubuntu-latest
    needs:
      - create-draft
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Load Secrets from Vault
        uses: rancher-eio/read-vault-secrets@7282bf97898cd1c16c89f837e0bb442e6d384c89 # main
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/dockerhub/rancher/credentials username | DOCKER_USERNAME ;
            secret/data/github/repo/${{ github.repository }}/dockerhub/rancher/credentials password | DOCKER_PASSWORD

      - name: Build and push image [Docker Hub]
        uses: rancher/ecm-distro-tools/actions/publish-image@e72fccc212c7179d2ff65d173371d8183e95453e # v0.77.7
        with:
          image: systemd-node
          tag: ${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64

          public-registry: docker.io
          public-repo: rancher
          public-username: ${{ env.DOCKER_USERNAME }}
          public-password: ${{ env.DOCKER_PASSWORD }}
          make-target: push-image

          push-to-prime: false

      - name: Build and push image [GHCR]
        uses: rancher/ecm-distro-tools/actions/publish-image@e72fccc212c7179d2ff65d173371d8183e95453e # v0.77.7
        with:
          image: systemd-node
          tag: ${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          skip-buildx-setup: true

          public-registry: ghcr.io
          public-repo: ${{ github.repository_owner }}
          public-username: ${{ github.repository_owner }}
          public-password: ${{ secrets.GITHUB_TOKEN }}
          make-target: push-image

          push-to-prime: false

  finalize:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - publish
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS="--draft=false"
          if [[ "${GITHUB_REF_NAME}" == *"-rc"* ]]; then
            FLAGS="${FLAGS} --prerelease"
          fi
          gh release edit -R "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" $flags
